<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ttp fund</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  :root { --cream:#ffefd9; --card:#fff8ee; --green:#004032; --soft:rgba(0,64,50,.6); --line:rgba(0,64,50,.18); }
  * { box-sizing:border-box; }
  html, body { overflow-x:hidden; }
  body { margin:0; background:var(--cream); color:var(--green);
         font-family:"Space Grotesk",sans-serif; font-size:16px; line-height:1.55; }
  main { max-width:560px; margin:0 auto; padding:56px 20px 80px; }
  h1 { font-weight:300; font-size:clamp(40px,9vw,58px); line-height:1; margin:0 0 12px; }
  .note { color:var(--soft); margin:0 0 32px; }
  form { display:flex; border-bottom:1px solid var(--green); }
  input { flex:1; min-width:0; border:0; background:transparent; color:var(--green);
          font:inherit; font-size:17px; padding:12px 0; outline:none; }
  input::placeholder { color:var(--soft); }
  button { border:0; background:none; color:var(--green); font:inherit; font-weight:600; cursor:pointer; }
  form button { font-size:17px; padding:12px 0 12px 16px; }
  button:disabled { opacity:.5; cursor:wait; }
  .status { color:var(--soft); margin:12px 0 0; min-height:1.5em; }

  .deck-head { margin-top:36px; display:flex; justify-content:space-between; align-items:flex-end; gap:12px; }
  .deck-head h2 { font-weight:300; font-size:26px; margin:0; }
  .deck-head a { color:var(--soft); font-size:14px; }
  .tally { margin:16px 0 20px; padding:16px 0; border-top:1px solid var(--line); border-bottom:1px solid var(--line);
           display:flex; justify-content:space-between; align-items:baseline; }
  .tally .sofar { font-size:30px; font-weight:300; font-variant-numeric:tabular-nums; }
  .tally .of { color:var(--soft); font-size:14px; text-align:right; }

  .stack { position:relative; height:440px; }
  .card { position:absolute; inset:0; background:var(--card); border:1px solid var(--line); border-radius:22px;
          padding:26px; display:flex; flex-direction:column; touch-action:pan-y; user-select:none;
          cursor:grab; transition:transform .35s ease, opacity .35s ease; }
  .card.dragging { transition:none; cursor:grabbing; }
  .card.behind { transform:translateY(10px) scale(.96); opacity:.6; pointer-events:none; }
  .card .name { font-weight:600; overflow-wrap:anywhere; }
  .card .amt { font-size:46px; font-weight:300; line-height:1.1; margin:14px 0 2px; direction:ltr;
               font-variant-numeric:tabular-nums; }
  .card .pkr { color:var(--soft); }
  .card .text { margin-top:18px; flex:1; overflow:auto; white-space:pre-wrap; overflow-wrap:anywhere; font-size:17px; }
  .card .stamp { position:absolute; top:22px; left:22px; border:2px solid var(--green); border-radius:8px;
                 padding:2px 10px; font-weight:600; opacity:0; transform:rotate(-8deg); }

  .controls { display:flex; justify-content:space-between; margin-top:18px; }
  .controls button { font-size:17px; padding:10px 0; }
  .controls button:disabled { opacity:.3; cursor:default; }
  .hint { text-align:center; color:var(--soft); font-size:14px; margin-top:6px; }

  .done { text-align:center; padding:60px 10px; }
  .done .big { font-size:44px; font-weight:300; margin:8px 0; }
  footer { margin-top:56px; color:var(--soft); font-size:14px; }
</style>
</head>
<body>
<main>
  <h1>ttp fund</h1>
  <p class="note">A fan-made tool for the Triple Trouble Podcast — so every Super Thanks gets read.</p>

  <form id="f">
    <input id="url" type="url" placeholder="Paste a YouTube link" required>
    <button id="go" type="submit">Get comments →</button>
  </form>
  <p id="status" class="status"></p>

  <div id="deck" hidden>
    <div class="deck-head"><h2 id="title"></h2><a id="watch" target="_blank" rel="noopener">watch</a></div>
    <div class="tally">
      <div><div class="sofar" id="sofar">PKR 0</div><div class="of" style="text-align:left">read so far</div></div>
      <div class="of"><span id="count">0 / 0</span></div>
    </div>
    <div class="stack" id="stack"></div>
    <div class="controls">
      <button id="next">← next</button>
      <button id="back">back →</button>
    </div>
    <p class="hint">Swipe left (or press ←) for the next one</p>
  </div>

  <footer>Made with love by a TTP listener. Not affiliated with the channel.</footer>
</main>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// ---- currency → PKR (live rates) ----
const SYMBOLS = { "$":"USD","US$":"USD","A$":"AUD","CA$":"CAD","NZ$":"NZD","HK$":"HKD","€":"EUR","£":"GBP",
                  "¥":"JPY","₹":"INR","₩":"KRW","R$":"BRL","MX$":"MXN","Rs":"PKR" };
const ratesP = fetch("https://open.er-api.com/v6/latest/USD").then(r => r.json()).then(d => d.rates).catch(() => null);
function toPKR(amount, rates) {
  if (!rates) return 0;
  const clean = amount.replace(/[‎‏]/g, "").trim();
  const num = clean.match(/[\d.,]+/);
  if (!num) return 0;
  const value = parseFloat(num[0].replace(/,/g, ""));
  const code = SYMBOLS[clean.replace(num[0], "").trim()] || clean.replace(num[0], "").trim().toUpperCase();
  return rates[code] && rates.PKR ? value / rates[code] * rates.PKR : 0;
}
const fmt = n => "PKR " + Math.round(n).toLocaleString("en-PK");

// ---- deck state ----
let cards = [], i = 0;

async function loadDeck(title, video, rows) {
  const rates = await ratesP;
  cards = rows.map(r => ({ ...r, amount: r.amount.replace(/[‎‏]/g, "").trim(), pkr: toPKR(r.amount, rates) }));
  i = 0;
  $("title").textContent = title;
  $("watch").href = video;
  $("deck").hidden = false;
  render();
}

function render() {
  const sofar = cards.slice(0, i).reduce((s, c) => s + c.pkr, 0);
  $("sofar").textContent = fmt(sofar);
  $("count").textContent = `${Math.min(i, cards.length)} / ${cards.length}`;
  $("back").disabled = i === 0;
  $("next").disabled = i >= cards.length;

  if (i >= cards.length) {
    $("stack").innerHTML = `<div class="done"><div>All ${cards.length} read</div>
      <div class="big">${fmt(sofar)}</div><button onclick="i=0;render()">start over</button></div>`;
    return;
  }
  const card = c => `<div class="name">${esc(c.name)}</div>
      <div class="amt">${esc(c.amount)}</div>
      <div class="pkr">${c.pkr ? "≈ " + fmt(c.pkr) : ""}</div>
      <div class="text">${esc(c.comment)}</div>
      <div class="stamp">READ</div>`;
  const behind = cards[i + 1] ? `<div class="card behind">${card(cards[i + 1])}</div>` : "";
  $("stack").innerHTML = behind + `<div class="card" id="top">${card(cards[i])}</div>`;
  attachDrag($("top"));
}

function go(dir) {
  const top = $("top");
  if (dir > 0 && i < cards.length) {
    if (top) { top.style.transform = "translateX(-140%) rotate(-18deg)"; top.style.opacity = 0; }
    i++; setTimeout(render, top ? 250 : 0);
  } else if (dir < 0 && i > 0) {
    i--; render();
  }
}

function attachDrag(el) {
  const stamp = el.querySelector(".stamp");
  el.addEventListener("pointerdown", e => {
    if (e.button !== 0) return;
    e.preventDefault();
    const x0 = e.clientX; let dx = 0;
    el.classList.add("dragging");
    const move = ev => {
      dx = ev.clientX - x0;
      el.style.transform = `translateX(${dx}px) rotate(${dx / 20}deg)`;
      stamp.style.opacity = Math.max(0, Math.min(1, -dx / 120));
    };
    let finished = false;
    const up = () => {
      if (finished) return; finished = true;
      document.removeEventListener("mouseup", up);
      document.removeEventListener("pointermove", move);
      document.removeEventListener("pointerup", up);
      document.removeEventListener("pointercancel", up);
      el.classList.remove("dragging");
      if (dx < -110) go(1);
      else if (dx > 110) { el.style.transform = ""; go(-1); }
      else { el.style.transform = ""; stamp.style.opacity = 0; }
    };
    document.addEventListener("pointermove", move);
    document.addEventListener("pointerup", up);
    document.addEventListener("pointercancel", up);
    document.addEventListener("mouseup", up);
  });
  el.addEventListener("dragstart", e => e.preventDefault());
}

$("next").onclick = () => go(1);
$("back").onclick = () => go(-1);
document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT" || $("deck").hidden) return;
  if (e.key === "ArrowLeft") go(1);
  if (e.key === "ArrowRight") go(-1);
});

// ---- latest TTP episode by default ----
fetch("/ttp_latest.json").then(r => r.json())
  .then(d => loadDeck("Latest TTP episode", d.video, d.results)).catch(() => {});

// ---- search any video ----
$("f").addEventListener("submit", async e => {
  e.preventDefault();
  $("go").disabled = true;
  $("status").textContent = "Reading comments… big videos can take a minute.";
  try {
    const res = await fetch("/api/thanks?url=" + encodeURIComponent($("url").value.trim()));
    let d;
    try { d = await res.json(); }
    catch { throw new Error("Search isn't available here — it only works on the deployed site (or with `vercel dev`)."); }
    if (!res.ok) throw new Error(d.error || "Something went wrong.");
    if (!d.count) { $("status").textContent = `No Super Thanks found in ${d.scanned} comments.`; return; }
    $("status").textContent = "";
    await loadDeck("This video", "https://www.youtube.com/watch?v=" + d.video_id, d.results);
  } catch (err) {
    $("status").textContent = err.message;
  } finally {
    $("go").disabled = false;
  }
});
</script>
</body>
</html>
