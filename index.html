<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ttp fund</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  :root { --cream:#ffefd9; --green:#004032; --soft:rgba(0,64,50,.6); --line:rgba(0,64,50,.18); }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--cream); color:var(--green);
         font-family:"Space Grotesk",sans-serif; font-size:16px; line-height:1.55; }
  main { max-width:720px; margin:0 auto; padding:72px 20px 96px; }
  h1 { font-weight:300; font-size:clamp(38px,7vw,58px); line-height:1.02; margin:0 0 16px; letter-spacing:-.01em; }
  h2 { font-weight:300; font-size:28px; margin:0; }
  .note { color:var(--soft); margin:0 0 40px; }
  form { display:flex; border-bottom:1px solid var(--green); }
  input { flex:1; min-width:0; border:0; background:transparent; color:var(--green);
          font:inherit; font-size:18px; padding:14px 0; outline:none; }
  input::placeholder { color:var(--soft); }
  button { border:0; background:none; color:var(--green); font:inherit; font-weight:600;
           font-size:18px; cursor:pointer; padding:14px 0 14px 16px; }
  button:disabled { opacity:.5; cursor:wait; }
  .status { color:var(--soft); margin:16px 0 0; min-height:1.5em; }
  section { margin-top:56px; }
  .bar { display:flex; justify-content:space-between; align-items:baseline; gap:12px; flex-wrap:wrap;
         padding-bottom:12px; border-bottom:1px solid var(--line); }
  .bar a, .bar span { color:var(--soft); font-size:14px; }
  .row { padding:18px 0; border-bottom:1px solid var(--line); }
  .top { display:flex; justify-content:space-between; gap:16px; }
  .name { font-weight:600; overflow-wrap:anywhere; }
  .amt { font-variant-numeric:tabular-nums; white-space:nowrap; direction:ltr; }
  .text { margin-top:4px; white-space:pre-wrap; overflow-wrap:anywhere; }
  a { color:var(--green); }
  footer { margin-top:64px; color:var(--soft); font-size:14px; }
</style>
</head>
<body>
<main>
  <h1>ttp fund</h1>
  <p class="note">A fan-made tool for the Triple Trouble Podcast — so every Super Thanks gets read.</p>

  <form id="f">
    <input id="url" type="url" placeholder="Paste a YouTube link" required>
    <button id="go" type="submit">Get comments →</button>
  </form>
  <p id="status" class="status"></p>

  <section id="result" hidden></section>
  <section id="latest"></section>

  <footer>Made with love by a TTP listener. Not affiliated with the channel.</footer>
</main>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function block(title, video, rows) {
  const items = rows.map(r => `
    <div class="row">
      <div class="top"><span class="name">${esc(r.name)}</span><span class="amt">${esc(r.amount)}</span></div>
      <div class="text">${esc(r.comment)}</div>
    </div>`).join("");
  return `<div class="bar"><h2>${esc(title)}</h2>
    <span>${rows.length} Super Thanks · <a href="${esc(video)}" target="_blank" rel="noopener">watch</a></span></div>${items}`;
}

fetch("/ttp_latest.json").then(r => r.json()).then(d => {
  $("latest").innerHTML = block("Latest TTP episode", d.video, d.results);
}).catch(() => {});

$("f").addEventListener("submit", async e => {
  e.preventDefault();
  $("go").disabled = true;
  $("status").textContent = "Reading comments… big videos can take a minute.";
  try {
    const res = await fetch("/api/thanks?url=" + encodeURIComponent($("url").value.trim()));
    let d;
    try { d = await res.json(); }
    catch { throw new Error("Search isn't available here — it only works on the deployed site (or with `vercel dev`)."); }
    if (!res.ok) throw new Error(d.error || "Something went wrong.");
    $("status").textContent = d.count ? "" : `No Super Thanks found in ${d.scanned} comments.`;
    if (d.count) {
      $("result").innerHTML = block("This video", "https://www.youtube.com/watch?v=" + d.video_id, d.results);
      $("result").hidden = false;
    }
  } catch (err) {
    $("status").textContent = err.message;
  } finally {
    $("go").disabled = false;
  }
});
</script>
</body>
</html>
